name: Claude development (subscription)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  develop:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/build')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Claude designs, implements, tests and opens a PR
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: 'true'
          show_full_output: 'false'
          prompt: |
            Implement GitHub Issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Read the Issue title, body, and acceptance criteria first.
            You own design, implementation, and initial verification.
            Keep changes minimal. Do not change repository automation or CI configuration.
            Do not modify main. Create a task branch and open a PR against main.
            Include a concise summary, verification performed, and any known limitations.
            Do not auto-merge. Escalate security-sensitive, irreversible or breaking changes.
          claude_args: |
            --max-turns 25
            --allowedTools "Bash(python3:*)"

      - name: Safe execution diagnostics
        if: always()
        env:
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          {
            echo "## Claude execution diagnostics"
            echo "- Action conclusion: ${CLAUDE_CONCLUSION:-not reported}"
            if [[ -n "${CLAUDE_BRANCH}" ]]; then
              echo "- Claude branch created: yes"
            else
              echo "- Claude branch created: no / not reported"
            fi
            echo "- Full tool transcript: disabled to protect secrets"
            echo "- A successful Action run does not prove a PR was created; inspect the PR tab."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify task pull request was created
        if: steps.claude.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_STARTED_AT: ${{ github.event.comment.created_at }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## PR verification" >> "$GITHUB_STEP_SUMMARY"
          # Only accept PRs created after the triggering comment, targeting main.
          # Match the agent branch when available; otherwise require an Issue reference.
          prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100")"
          matches="$(jq -r --arg branch "$CLAUDE_BRANCH" --arg n "$ISSUE_NUMBER" --arg since "$RUN_STARTED_AT" '
            [.[] | select(.base.ref == "main" and .created_at >= $since)
             | select(
                ($branch != "" and .head.ref == $branch)
                or ((.body // "" | test("(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?)?\\s*#"+$n+"([^0-9]|$)"))
                    and .head.ref != "main")
               )
            ] | .[].html_url' <<< "$prs")"
          if [[ -z "$matches" ]]; then
            echo "- No matching PR was created by this run" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Claude Action finished but produced no PR for Issue #$ISSUE_NUMBER"
            exit 1
          fi
          echo "- Matching PR detected" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$matches" >> "$GITHUB_STEP_SUMMARY"
