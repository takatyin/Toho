name: Claude development (subscription)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  develop:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/build')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare task and branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json title,body --jq '"Title: " + .title + "\n\n" + .body' > "$RUNNER_TEMP/issue.txt"
          git switch -c "ai/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          cat > "$RUNNER_TEMP/task.txt" <<'PROMPT'
          Implement the original GitHub Issue provided after these instructions.
          You are responsible for design, implementation, and self-testing.
          Make actual file edits in the checked-out repository. Do NOT commit, push,
          open a PR, or change branches; GitHub Actions owns publication.
          Do not alter .github/, AGENTS.md, CLAUDE.md, scripts/verify.sh,
          or secrets/credentials. Do not access external services.
          Keep changes minimal; do not claim unrun tests passed.
          If you cannot implement the requirements, explain why instead of
          inventing results. Stop after completing the local changes and tests.
          PROMPT
          cat "$RUNNER_TEMP/issue.txt" >> "$RUNNER_TEMP/task.txt"

      - name: Claude implements and self-tests
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_EFFORT_LEVEL: medium
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          "$HOME/.local/bin/claude" -p \
            --model opus \
            --permission-mode acceptEdits \
            --allowedTools 'Read,Write,Edit,Glob,Grep,Bash(python3:*),Bash(python:*)' \
            --max-turns 25 \
            --output-format text < "$RUNNER_TEMP/task.txt" > "$RUNNER_TEMP/claude-output.txt"
          echo "Claude completed. Tool transcript is not made public."

      - name: Validate local changes
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Claude made no file changes"
            exit 1
          fi
          if git diff --cached --name-only | grep -E '^(\.github/|AGENTS\.md$|CLAUDE\.md$|scripts/verify\.sh$|\.env($|\.)|.*\.(pem|key)$)'; then
            echo "::error::Protected file change detected; refusing to publish"
            exit 1
          fi
          echo "## Claude development" >> "$GITHUB_STEP_SUMMARY"
          echo "Files changed: $(git diff --cached --name-only | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "Review and test evidence must be checked in the PR." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, push and create PR (GitHub Actions only)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement issue #$ISSUE_NUMBER"
          gh auth setup-git
          branch="$(git branch --show-current)"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" \
            --title "Implement issue #$ISSUE_NUMBER" \
            --body "Implements #$ISSUE_NUMBER. Claude performed implementation and initial checks. Independent Codex review and human approval are still required. No automatic merge.")"
          echo "## Pull request" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
